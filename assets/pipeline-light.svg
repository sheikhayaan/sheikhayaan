  <text x="719" y="98" font-family="'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.4" font-weight="650" letter-spacing="-0.1" fill="#101a28">Worker</text>
  <text x="719" y="116" font-family="'SFMono-Regular',ui-monospace,Consolas,'Liberation Mono',Menlo,monospace" font-size="8.4" fill="#4e5c70">exactly-once ledger</text>

  <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8f5ec"/>
  </linearGradient>
  <radialGradient id="bloomField" cx="0.5" cy="0.42" r="0.62">
    <stop offset="0" stop-color="#0f766e" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4338ca" stop-opacity="0.1"/>
    <stop offset="1" stop-color="#4338ca" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cardFill" x1="0" y1="0" x2="0.14" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fdfaf4"/>
  </linearGradient>
  <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#4338ca"/>
  </linearGradient>
  <linearGradient id="barGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0f766e" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#0f766e" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#4338ca" stop-opacity="0.7"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1" fill="#d9d2c1" opacity="0.7"/>
  </pattern>
  <pattern id="gridFine" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0 H0 V30" fill="none" stroke="#d9d2c1" stroke-width="0.6" opacity="0.45"/>
  </pattern>
<filter id="dlift" x="-8%" y="-8%" width="116%" height="120%">
         <feDropShadow dx="0" dy="2" stdDeviation="3.4" flood-color="#4a3f22" flood-opacity="0.08"/>
       </filter>
</defs>

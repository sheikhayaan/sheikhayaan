  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#05070c"/><stop offset="1" stop-color="#0a0f18"/>
  </linearGradient>
  <radialGradient id="washA" cx="0.18" cy="0.06" r="0.66">
    <stop offset="0" stop-color="rgba(94,234,212,0.11)"/><stop offset="1" stop-color="rgba(94,234,212,0.11)" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="washB" cx="0.94" cy="1.04" r="0.72">
    <stop offset="0" stop-color="rgba(124,156,255,0.10)"/><stop offset="1" stop-color="rgba(124,156,255,0.10)" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cardFill" x1="0" y1="0" x2="0.12" y2="1">
    <stop offset="0" stop-color="#121a26"/><stop offset="1" stop-color="#0b111a"/>
  </linearGradient>
  <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#7c9cff"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1" fill="#2a3648" opacity="0.5"/>
  </pattern>
<filter id="dglow" x="-30%" y="-30%" width="160%" height="160%">
         <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/>
         <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
       </filter>
</defs>

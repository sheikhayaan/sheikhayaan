<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="336" viewBox="0 0 1180 336"
     role="img" aria-labelledby="t d" aria-label="Animated flowchart of the AutoPR execution path: a signed GitHub webhook hits FastAPI ingress, is enqueued on Redis Streams, processed by a worker, then routed by risk either to an auto-comment or to a human approval gate." xml:space="preserve">
  <title id="t">AutoPR — execution path</title>
  <desc id="d">A five-stage pipeline diagram. GitHub event to FastAPI ingress to Redis Streams to Worker to Router. The router forks into two dispositions: auto-comment for low-risk findings, and a human approval gate for anything that changes code.</desc>

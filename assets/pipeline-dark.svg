<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="352" viewBox="0 0 1180 352"
     role="img" aria-labelledby="t d" aria-label="Flowchart of the AutoPR execution path: a GitHub webhook hits FastAPI ingress, is enqueued on Redis Streams, processed by a worker, then routed by risk either to an auto-comment or to a human approval gate." xml:space="preserve">
  <title id="t">AutoPR — execution path</title>
  <desc id="d">A five-stage flowchart. GitHub event to FastAPI ingress to Redis Streams to Worker to Router. The router forks into two dispositions: auto-comment for low-risk findings, and a human approval gate for anything that changes code. Failures retry a bounded number of times, then park in a dead letter.</desc>
  <defs>
  <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#000000"/>
    <stop offset="1" stop-color="#05080e"/>
  </linearGradient>
  <radialGradient id="bloomField" cx="0.5" cy="0.42" r="0.62">
    <stop offset="0" stop-color="#5eead4" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7c9cff" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cardFill" x1="0" y1="0" x2="0.14" y2="1">
    <stop offset="0" stop-color="#121a26"/><stop offset="1" stop-color="#0b111a"/>
  </linearGradient>
  <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#7c9cff"/>
  </linearGradient>
  <linearGradient id="barGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#5eead4" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#7c9cff" stop-opacity="0.7"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1" fill="#2a3648" opacity="0.45"/>
  </pattern>
  <pattern id="gridFine" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0 H0 V30" fill="none" stroke="#2a3648" stroke-width="0.6" opacity="0.28"/>
  </pattern>
<filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
         <feGaussianBlur stdDeviation="6"/>
       </filter>
       <filter id="bloomTight" x="-40%" y="-40%" width="180%" height="180%">
         <feGaussianBlur stdDeviation="2.6"/>
       </filter>
       <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
         <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"/>
         <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
       </filter>
</defs>

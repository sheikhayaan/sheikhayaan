  <title id="t">Mohd Ayaan — measured signals</title>
  <desc id="d">Left, a glowing donut of merged pull requests by upstream project with a legend of counts and shares. Right, horizontal bars of language bytes across every public repository, led by HTML, Python, JavaScript and TypeScript.</desc>
